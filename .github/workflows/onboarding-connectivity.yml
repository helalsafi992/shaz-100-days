name: SHAZ onboarding connectivity and navigation
on:
  push:
    branches: [fix/onboarding-load-visible-settings]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shaz-onboarding-connectivity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record exact commit
        run: |
          mkdir -p test-artifacts
          git rev-parse HEAD > test-artifacts/tested-commit.txt
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Existing integration flows
        run: npm run test:integration
      - name: Onboarding interrupted-network, safety and navigation flows
        run: node --import tsx scripts/intake-regression.mts
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-connectivity-evidence
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 7

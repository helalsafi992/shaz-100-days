name: SHAZ onboarding clarity verification
on:
  push:
    branches: [fix/onboarding-clarity-goal-safety]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shaz-onboarding-clarity-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Types and reusable plan rules
        run: npm run typecheck
      - name: Nutrition and goal unit tests
        run: npm test
      - name: Build customer app
        run: npm run build
      - name: Browser and database integration tests
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-verification
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 7

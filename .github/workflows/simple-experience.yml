name: SHAZ customer experience validation
on:
  push:
    branches: [feat/simple-customer-experience, feat/integrated-plans, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shaz-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record the exact tested commit
        run: |
          mkdir -p test-artifacts
          git rev-parse HEAD > test-artifacts/tested-commit.txt
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Integration tests with isolated database and browser
        run: npm run test:integration
      - name: Fresh test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            test-artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Tested source snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            app
            components
            lib
            scripts
            tests
            migrations
            public
            docs
            package.json
            package-lock.json
            tsconfig.json
            next.config.ts
            postcss.config.mjs
            railway.json
            instrumentation.ts
          retention-days: 3
